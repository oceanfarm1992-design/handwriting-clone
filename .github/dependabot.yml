# Dependabot: keeps the GitHub Actions used by the workflows up to date (weekly).
# The app's own libraries load from a CDN, which Dependabot cannot see; the monthly
# update bot (.github/workflows/update-bot.yml) looks after those.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
    commit-message:
      prefix: ci
