# Security bot (weekly, and on every pull request to main):
#  - CodeQL code scanning of the JavaScript (results in the Security tab)
#  - known vulnerabilities in the CDN libraries, pinning, integrity hashes, secrets, and
#    personal handwriting accidentally committed (scripts/security.mjs)
# Opens an issue when the scheduled check fails and closes it once it passes again.
name: Security check

on:
  schedule:
    - cron: '37 5 * * 3' # Wednesdays 05:37 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vulnerabilities, pinning, integrity, secrets, personal data
        run: node scripts/security.mjs --report security.md

      - name: Open an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue.mjs open "Weekly security check failed" security.md security

      - name: Close the issue once fixed
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue.mjs close "Weekly security check failed" security

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
